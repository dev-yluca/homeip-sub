name: 更新家宽订阅

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成订阅
        run: python3 generate.py > jiakuan.yaml

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jiakuan.yaml
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新家宽节点 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

# 家宽订阅：CF 节点带路，落地是住宅宽带
# 内核要 1.19.25 以上，老内核不认这类节点
# 节点是网友共享的，掉线很正常，家宽自动会自己往下换
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query


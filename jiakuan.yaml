# 家宽订阅：CF 节点带路，落地是住宅宽带
# 内核要 1.19.25 以上，老内核不认这类节点
# 节点是网友共享的，掉线很正常，家宽自动会自己往下换
# 由 GitHub Actions 每小时自动更新
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query

proxies:
  - name: "jiakuan.moreyu-09.workers.dev:443"
    type: vless
    server: "jiakuan.moreyu-09.workers.dev"
    port: 443
    uuid: fcd5b2fb-2a7b-4536-bfb9-288a8411d9d3
    udp: true
    tls: true
    client-fingerprint: chrome
    servername: "jiakuan.moreyu-09.workers.dev"
    network: ws
    ws-opts:
      path: "/?ed=2048"
      headers:
        Host: "jiakuan.moreyu-09.workers.dev"
proxy-groups:  - name: "⚡ CF前置"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "jiakuan.moreyu-09.workers.dev:443"
  - name: "🏠 家宽自动"
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 1800
    lazy: true
    proxies:
rules:
  - MATCH,🏠 家宽自动
